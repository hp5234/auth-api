server:
  port: 8082
  servlet:
    encoding:
      charset: utf-8
      force: true
spring:
  application:
    name: auth-api
  datasource:
    url: jdbc:h2:mem:test;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      '[hibernate.default_batch_fetch_size]': 100
      '[hibernate.format_sql]': true
    show-sql: true
  output:
    ansi:
      enabled: always

app:
  jwt:
    key: clwmqjrj123tkwnEpdy

logging:
  level:
    '[com.jeon.auth_api]': DEBUG
    '[org.hibernate.type]': TRACE
